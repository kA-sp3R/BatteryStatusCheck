name: Windows compilation and focused unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  compile:
    name: Compile WPF solution (no application launch)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: ./.github/scripts/run-ci-command.ps1 -Name restore -Command @('dotnet', 'restore', 'DeviceBatteryStatus.sln')
      - name: Compile
        run: ./.github/scripts/run-ci-command.ps1 -Name compile -Command @('dotnet', 'build', 'DeviceBatteryStatus.sln', '--configuration', 'Release', '--no-restore')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-evidence-${{ github.run_attempt }}
          path: ci-logs/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ github.run_attempt }}
          path: src/DeviceBatteryStatus.App/bin/Release/net10.0-windows/
          if-no-files-found: error

  focused-unit-tests:
    name: Hardware-free model and protocol tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run focused unit tests only
        run: ./.github/scripts/run-ci-command.ps1 -Name focused -Command @('dotnet', 'test', 'tests/DeviceBatteryStatus.Tests/DeviceBatteryStatus.Tests.csproj', '--configuration', 'Release', '--logger', 'trx;LogFileName=focused.trx', '--results-directory', 'TestResults')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-unit-tests-evidence-${{ github.run_attempt }}
          path: |
            ci-logs/*.log
            TestResults/*.trx
          if-no-files-found: error

  offline-capture-tests:
    name: Offline USB capture parser tests (synthetic files only)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test offline capture parser
        run: ./.github/scripts/run-ci-command.ps1 -Name offline -Command @('python', '-m', 'unittest', 'discover', '-s', 'tools/alienware', '-p', 'test_*.py', '-v')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-capture-tests-evidence-${{ github.run_attempt }}
          path: ci-logs/*.log
          if-no-files-found: warn

  package:
    name: Package win-x64 (${{ matrix.flavor }}, no application launch)
    needs: [compile, focused-unit-tests, offline-capture-tests]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flavor: [framework-dependent, self-contained]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows application (no launch)
        run: |
          $selfContained = ('${{ matrix.flavor }}' -eq 'self-contained').ToString().ToLowerInvariant()
          ./.github/scripts/run-ci-command.ps1 -Name 'publish-${{ matrix.flavor }}' -Command @('dotnet', 'publish', 'src/DeviceBatteryStatus.App/DeviceBatteryStatus.App.csproj', '--configuration', 'Release', '--runtime', 'win-x64', '--self-contained', $selfContained, '--output', 'publish', '-p:DebugType=None', '-p:DebugSymbols=false', '-p:SourceRevisionId=${{ github.sha }}')
      - name: Assemble portable ZIP and checksums
        run: ./.github/scripts/package-windows.ps1 -PublishDirectory publish -Flavor '${{ matrix.flavor }}'
      - name: Inspect ZIP, PE headers, payload hashes and runtime metadata (no launch)
        run: ./.github/scripts/verify-windows-package.ps1 -Flavor '${{ matrix.flavor }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-evidence-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: ci-logs/*.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-win-x64-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  application-smoke:
    name: Windows application smoke (${{ matrix.flavor }}, synthetic data only)
    needs: [package]
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        flavor: [framework-dependent, self-contained]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview-win-x64-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: artifacts/smoke-input
      - name: Extract inspected portable package
        run: |
          $archive = @(Get-ChildItem artifacts/smoke-input -Filter '*-${{ matrix.flavor }}.zip')
          if ($archive.Count -ne 1) { throw 'Expected one inspected application ZIP.' }
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath smoke-app
      - name: Launch isolated software smoke branch (no HID or network)
        run: ./.github/scripts/run-application-smoke.ps1 -ApplicationPath smoke-app/DeviceBatteryStatus.exe -ReportDirectory artifacts/application-smoke -RequirePackageManifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-smoke-evidence-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: artifacts/application-smoke/
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Per-user installer build and install/upgrade/uninstall smoke (no app launch)
    needs: [package]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview-win-x64-self-contained-${{ github.run_attempt }}
          path: artifacts/installer-input
      - name: Build per-user installer from inspected self-contained ZIP
        run: |
          $archive = @(Get-ChildItem artifacts/installer-input -Filter '*-self-contained.zip')
          if ($archive.Count -ne 1) { throw 'Expected one inspected self-contained application ZIP.' }
          ./.github/scripts/build-installer.ps1 -PackagePath $archive[0].FullName -CreateUpgradeFixture
      - name: Smoke install, upgrade and uninstall without launching application
        run: |
          $setup = @(Get-ChildItem artifacts/installer -Filter '*-win-x64-setup.exe')
          $fixture = @(Get-ChildItem artifacts/installer/upgrade-fixture -Filter '*-win-x64-setup.exe')
          if ($setup.Count -ne 1 -or $fixture.Count -ne 1) { throw 'Expected the candidate installer and one upgrade fixture.' }
          ./.github/scripts/test-installer.ps1 -InstallerPath $setup[0].FullName -UpgradeFixturePath $fixture[0].FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-smoke-evidence-${{ github.run_attempt }}
          path: |
            artifacts/installer-smoke/
            ci-logs/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-win-x64-${{ github.run_attempt }}
          path: |
            artifacts/installer/*-win-x64-setup.exe
            artifacts/installer/*.sha256
            artifacts/installer/installer-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
